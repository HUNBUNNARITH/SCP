<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Producers Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- SheetJS: lets the browser read the .xlsx file directly -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--bd:#dfe5df;--tx:#26332b;--mut:#6b7a70;--in:#f7f9f7;--ac:#0b6b3a;--ac2:#e9f3ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",Inter,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--bd);padding:18px 16px;overflow:auto;height:100vh;position:sticky;top:0}
main{min-width:0}
.top{background:#fff;border-bottom:1px solid var(--bd);border-top:5px solid var(--ac);padding:16px 26px}
.top .t{font-size:1.35rem;font-weight:700}.top .s{color:var(--mut);font-size:.8rem;margin-top:2px}
.body{padding:16px 26px 24px}
h3{margin:0 0 8px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.sec{margin-bottom:20px}
button,select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;font:inherit;width:100%}
button{cursor:pointer;width:auto;color:var(--ac);font-weight:600}button:hover{background:var(--ac2)}
label.f{display:block;margin:8px 0 3px;color:var(--mut);font-size:.75rem}
label.chk{display:flex;gap:6px;align-items:center;margin-top:8px}
details{border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;background:var(--in)}
summary{padding:7px 10px;cursor:pointer;font-weight:600}
.opts{max-height:170px;overflow:auto;padding:2px 10px 8px}
.opts label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.chip{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:12px;padding:3px 11px;margin:0 6px 10px 0;font-size:.74rem;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;border-top:3px solid var(--ac)}
.kv{font-size:1.7rem;font-weight:700}.kl{font-weight:600}.ks{color:var(--mut);font-size:.72rem}
.g3{display:grid;grid-template-columns:1fr 2.4fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px;min-width:0;box-shadow:0 1px 2px rgba(20,40,25,.05)}
.ct{font-weight:700;margin-bottom:10px;font-size:.9rem}
.hb{margin-bottom:9px}.hl{display:flex;justify-content:space-between;gap:8px;font-size:.78rem}
.hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{height:8px;background:#e7ece8;border-radius:4px;margin-top:3px}.ht div{height:100%;border-radius:4px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;color:var(--mut);justify-content:center;margin-top:4px}
.leg i,#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#mapw{position:relative}
#map{width:100%;height:600px;border-radius:6px;background:#eef2ee;z-index:0}
#zoom{position:absolute;top:10px;right:10px;z-index:1000}
#zoom button{width:32px;padding:5px;background:#fff}
#legend{position:absolute;left:10px;bottom:24px;z-index:1000;background:rgba(255,255,255,.93);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:.72rem;max-width:230px}
.note{font-size:.72rem;color:var(--mut);margin-top:8px}
.leaflet-tooltip{font:12px/1.4 "Segoe UI",Arial,sans-serif}
.msg{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:30px;color:var(--mut);line-height:1.7}
.msg code{background:var(--in);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;color:var(--tx)}
.foot{font-size:.72rem;color:var(--mut)}
@media(max-width:1150px){#app{grid-template-columns:1fr}aside{height:auto;position:static}.g3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
<aside>
  <div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Filters</h3><button id="reset">Reset</button></div>
    <div id="filters" style="margin-top:10px"></div>
  </div>
  <div class="sec">
    <h3>Map</h3>
    <label class="f">Basemap</label>
    <select id="base">
      <option value="light">Light gray (Esri)</option>
      <option value="osm">OpenStreetMap</option>
      <option value="sat">Satellite (Esri)</option>
      <option value="dark">Dark gray (Esri)</option>
      <option value="none">None</option>
    </select>
    <label class="chk"><input type="checkbox" id="showpoly" checked> Village polygons (count)</label>
    <label class="chk"><input type="checkbox" id="showpts" checked> GPS points</label>
    <div class="foot" id="bndmsg" style="margin-top:6px"></div>
  </div>
  <p class="foot" id="srcinfo"></p>
</aside>
<main>
  <div class="top"><div class="t">Community Producers Dashboard</div><div class="s">Who the producers are, what they grow and where they live</div></div>
  <div class="body">
    <div id="empty" class="msg">Loading data ...</div>
    <div id="nomatch" class="msg" hidden>No producers match the current filters. Adjust or reset the filters.</div>
    <div id="dash" hidden>
      <div id="chips"></div>
      <div class="kpis" id="kpis"></div>
      <div class="g3">
        <div>
          <div class="card"><div class="ct">Producers by Commodity</div><div id="commodity"></div></div>
          <div class="card"><div class="ct">Gender</div><div id="gender" style="text-align:center"></div></div>
        </div>
        <div class="card"><div class="ct">Where the Producers Are</div>
          <div id="mapw"><div id="map"></div>
            <div id="zoom"><button id="zf" title="Fit to producers">&#9974;</button></div>
            <div id="legend"></div></div>
          <div class="note" id="mapnote"></div></div>
        <div>
          <div class="card"><div class="ct">Producers by Commune (top 10)</div><div id="commune"></div></div>
          <div class="card"><div class="ct">Size of Growing Land</div><div id="land"></div></div>
        </div>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</main>
</div>
<script>
/* ================= SETTINGS ================= */
const DATA_FILE = "Producers_WGS84_Final_clean.xlsx";
const BOUNDARY_FILE = "Village_Boundary.geojson";
const OTHER = "Other Villages";                        // villages with no polygon
const FK = ["commodity", "commune", "sex", "status"];  // filter fields
const LBL = {commodity: "Commodity", commune: "Commune", sex: "Sex", status: "Status"};
const PAL = ["#0b6b3a", "#f2b134", "#c0562b", "#8a6bb0", "#7ab648", "#6f8f9c", "#a3a3a3", "#d94f70"];
const SCALE = ["#e3eef7", "#b3d1e8", "#6fa8cf", "#2f7fb5"];     // polygon colours (few -> many)
const SEXCOL = {Female: "#c0562b", Male: "#2f7fb5", Unspecified: "#a3a3a3"};
/* Excel column names (lowercase). If you rename a column in Excel, change it here. */
const COLS = {
  id: ["farm id"], sex: ["sex"], commodity: ["type of commodity"], village: ["village"], commune: ["commune"],
  land: ["size of growing land (ha)"], status: ["any remarks to highligh"],
  lat: ["latitude_wgs84"], lon: ["longitude_wgs84"]
};
const REQUIRED = ["sex", "commodity", "village", "commune", "land", "lat", "lon"];

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const fmt = (n, d = 0) => Number(n).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const clean = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
const keyOf = s => clean(s).toLowerCase().replace(/[^a-z0-9]/g, "");
let DATA = [], CUR = [], F = {}, BGJ = null, COUNTS = new Map();
FK.forEach(k => F[k] = new Set());

/* ================= LOAD THE EXCEL ================= */
function load() {
  fetch(DATA_FILE + "?t=" + Date.now(), {cache: "no-store"})
    .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(readWorkbook)
    .catch(showPicker);
}
function readWorkbook(buf) {
  try {
    const wb = XLSX.read(buf, {type: "array"});
    ingest(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ""}));
  } catch (e) { showError("Could not read the Excel file: " + esc(e.message || e)); }
}
function showError(html) { $("empty").hidden = false; $("dash").hidden = true; $("empty").innerHTML = html; }
function showPicker() {   // used when the page is opened by double-click (browser blocks reading files)
  showError(`<b>Could not read <code>${DATA_FILE}</code> automatically.</b><br>
    Open the dashboard through a local server (for example <code>start_dashboard.bat</code>), or select the file once:<br>
    <input type="file" id="xfile" accept=".xlsx,.xls">`);
  $("xfile").onchange = e => { const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => readWorkbook(r.result); r.readAsArrayBuffer(f); };
}

/* Turn Excel rows into clean producer records */
function ingest(rows) {
  const hmap = {};
  Object.keys(rows[0] || {}).forEach(h => hmap[h.trim().toLowerCase()] = h);
  const col = name => COLS[name].find(n => hmap[n] !== undefined);
  const missing = REQUIRED.filter(n => !col(n));
  if (missing.length) {
    showError("Missing column(s) in the Excel file: " + missing.map(n => `<code>${COLS[n][0]}</code>`).join(" "));
    return;
  }
  const get = (r, n) => col(n) ? r[hmap[col(n)]] : "";

  DATA = rows.map(r => {
    const sx = clean(get(r, "sex")).toLowerCase();
    const cm = clean(get(r, "commodity")).toLowerCase();
    const lat = parseFloat(get(r, "lat")), lon = parseFloat(get(r, "lon"));
    return {
      id: clean(get(r, "id")),
      sex: sx === "m" || sx === "male" ? "Male" : sx === "f" || sx === "female" ? "Female" : "Unspecified",
      commodity: cm === "cacoa" ? "Cacao" : cm ? cm.charAt(0).toUpperCase() + cm.slice(1) : "Unspecified",
      village: clean(get(r, "village")) || OTHER,
      commune: clean(get(r, "commune")) || "Unspecified",
      status: clean(get(r, "status")) || "Not recorded",
      land: parseFloat(String(get(r, "land")).replace(/,/g, "")),
      lat: lat, lon: lon,
      hasXY: lat >= 10 && lat <= 15 && lon >= 102 && lon <= 108     // inside Cambodia
    };
  }).filter(r => r.commodity !== "Unspecified" || r.village !== OTHER || r.id);

  // Different spellings of the same commune (SokSan / Sok San) -> use the most common one
  const spell = {};
  DATA.forEach(r => { const k = keyOf(r.commune); (spell[k] = spell[k] || {})[r.commune] = (spell[k][r.commune] || 0) + 1; });
  DATA.forEach(r => { const o = spell[keyOf(r.commune)]; r.commune = Object.keys(o).sort((a, b) => o[b] - o[a])[0]; });

  if (!DATA.length) { showError("The Excel file has no valid rows."); return; }
  resetAll();
}

/* ================= FILTERS ================= */
const apply = upto => DATA.filter(r => FK.every((k, i) => i >= upto || !F[k].size || F[k].has(r[k])));
function resetAll() { FK.forEach(k => F[k].clear()); update(true); }
function renderFilters() {
  const box = $("filters"), open = new Set([...box.querySelectorAll("details[open]")].map(x => x.dataset.k));
  box.innerHTML = "";
  FK.forEach((k, i) => {
    const opts = [...new Set(apply(i).map(r => r[k]))].sort();
    F[k] = new Set([...F[k]].filter(v => opts.includes(v)));
    const d = document.createElement("details");
    d.dataset.k = k; d.open = open.has(k) || (!open.size && i < 2);
    d.innerHTML = `<summary>${LBL[k]}${F[k].size ? ` (${F[k].size})` : ""}</summary>`;
    const l = document.createElement("div"); l.className = "opts";
    opts.forEach(v => {
      const lb = document.createElement("label"), c = document.createElement("input");
      c.type = "checkbox"; c.checked = F[k].has(v);
      c.onchange = () => { c.checked ? F[k].add(v) : F[k].delete(v); update(true); };
      lb.append(c, " " + v); l.append(lb);
    });
    d.append(l); box.append(d);
  });
}

/* ================= SMALL CHARTS ================= */
const group = (d, k) => { const m = new Map(); d.forEach(r => m.set(r[k], (m.get(r[k]) || 0) + 1));
  return [...m].map(([k, v]) => ({k, v})).sort((a, b) => b.v - a.v); };
function hbar(el, items, colors) {
  const m = Math.max(...items.map(x => x.v), 1);
  el.innerHTML = items.map((x, i) => `<div class="hb"><div class="hl"><span>${esc(x.k)}</span><b>${fmt(x.v)}</b></div>
    <div class="ht"><div style="width:${x.v / m * 100}%;background:${colors ? colors(x.k, i) : PAL[i % 8]}"></div></div></div>`).join("");
}
function donut(el, items, colorOf, big, small) {
  const tot = items.reduce((s, x) => s + x.v, 0) || 1, R = 70, C = 2 * Math.PI * R; let off = 0;
  let s = `<svg viewBox="0 0 200 200" width="170" height="170"><g transform="rotate(-90 100 100)">`;
  items.forEach(x => { const len = x.v / tot * C;
    s += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${colorOf(x.k)}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`; off += len; });
  s += `</g><text x="100" y="102" text-anchor="middle" fill="#26332b" font-size="24" font-weight="700">${big}</text>
    <text x="100" y="121" text-anchor="middle" fill="#6b7a70" font-size="11">${small}</text></svg>
    <div class="leg">${items.map(x => `<span><i style="background:${colorOf(x.k)}"></i>${esc(x.k)} (${fmt(x.v)})</span>`).join("")}</div>`;
  el.innerHTML = s;
}

/* ================= MAP (Leaflet) ================= */
const BASES = {
  light: {u: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", o: {maxZoom: 16, attribution: "Tiles &copy; Esri"}},
  dark: {u: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", o: {maxZoom: 16, attribution: "Tiles &copy; Esri"}},
  osm: {u: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", o: {maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"}},
  sat: {u: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", o: {maxZoom: 19, attribution: "Tiles &copy; Esri"}}
};
const FALLBACK = ["light", "sat", "osm"];
let map = null, baseLayer = null, BASE_NOW = "", pts = null, polyLayer = null, tileErr = 0, tried = new Set();

function initMap() {
  map = L.map("map", {zoomSnap: 0.25}).setView([12.4, 107.2], 9);   // Mondulkiri
  map.createPane("poly").style.zIndex = 350;   // polygons below
  map.createPane("pts").style.zIndex = 450;    // points above
  pts = L.layerGroup().addTo(map);
}
function setBase(name) {
  if (name === BASE_NOW) return;
  BASE_NOW = name; tileErr = 0;
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
  $("map").style.background = name === "dark" ? "#1a1f26" : "#eef2ee";
  if (name === "none") return;
  tried.add(name);
  baseLayer = L.tileLayer(BASES[name].u, BASES[name].o).addTo(map);
  baseLayer.on("tileerror", () => {
    if (++tileErr < 6) return;
    const next = FALLBACK.find(k => !tried.has(k));
    if (next) { $("base").value = next; BASE_NOW = ""; setBase(next); }
  });
}
function fitMap() {
  if (!map) return;
  const b = L.latLngBounds([]);
  CUR.filter(r => r.hasXY).forEach(r => b.extend([r.lat, r.lon]));
  if (polyLayer) polyLayer.eachLayer(l => { if (COUNTS.get(l.feature.properties.V_Name_E)) b.extend(l.getBounds()); });
  if (b.isValid()) map.fitBounds(b, {padding: [30, 30], maxZoom: 13});
}
function drawMap(fit) {
  if (!map) initMap();
  map.invalidateSize(); setBase($("base").value);
  if (polyLayer) { map.removeLayer(polyLayer); polyLayer = null; }
  pts.clearLayers();

  // Producers per village (all producers, with or without GPS)
  COUNTS = new Map();
  CUR.forEach(r => COUNTS.set(r.village, (COUNTS.get(r.village) || 0) + 1));
  const maxC = Math.max(1, ...[...COUNTS].filter(([k]) => k !== OTHER).map(([, v]) => v));
  const showPoly = BGJ && $("showpoly").checked;

  if (showPoly) {
    polyLayer = L.geoJSON(BGJ, {
      pane: "poly",
      style: f => { const n = COUNTS.get(f.properties.V_Name_E) || 0;
        return {color: "#6b7a70", weight: 1, fillColor: n ? SCALE[Math.min(3, Math.floor(n / maxC * 4))] : "#f1f3f1", fillOpacity: n ? 0.75 : 0.3}; },
      onEachFeature: (f, l) => l.bindTooltip(`<b>${esc(f.properties.V_Name_E)}</b><br>${fmt(COUNTS.get(f.properties.V_Name_E) || 0)} producer(s)`, {sticky: true})
    }).addTo(map);
  }

  // GPS points: colour = commodity, size = land
  const cats = [...new Set(DATA.map(r => r.commodity))].sort();
  const maxLand = Math.max(1, ...CUR.map(r => r.land).filter(isFinite));
  if ($("showpts").checked) {
    CUR.filter(r => r.hasXY).forEach(r => {
      L.circleMarker([r.lat, r.lon], {pane: "pts", radius: isFinite(r.land) ? 4 + 8 * Math.sqrt(r.land / maxLand) : 5,
        color: "#fff", weight: 1.2, fillColor: PAL[cats.indexOf(r.commodity) % 8], fillOpacity: 0.9})
      .bindTooltip(`<b>${esc(r.id || "Producer")}</b><br>${esc(r.commodity)}<br>${esc(r.village)} | ${esc(r.commune)}<br>${isFinite(r.land) ? fmt(r.land, 2) + " ha" : "Land not recorded"}`, {sticky: true})
      .addTo(pts);
    });
  }
  if (fit) fitMap();

  // Legend
  let h = `<div><b>Commodity</b></div>` + cats.filter(c => CUR.some(r => r.commodity === c))
    .map(c => `<div><i style="background:${PAL[cats.indexOf(c) % 8]}"></i>${esc(c)}</div>`).join("");
  if (showPoly) h += `<div style="margin-top:6px"><b>Producers per village</b></div>
    <div style="height:8px;border-radius:4px;margin:4px 0;background:linear-gradient(90deg,${SCALE.join(",")})"></div>
    <div style="display:flex;justify-content:space-between"><span>1</span><span>${fmt(maxC)}</span></div>`;
  $("legend").innerHTML = h;

  // Honest note about what the map does and does not show
  const withXY = CUR.filter(r => r.hasXY).length;
  let note = `GPS points: ${fmt(withXY)} of ${fmt(CUR.length)} producers have valid coordinates.`;
  if (BGJ) {
    const names = new Set(BGJ.features.map(f => f.properties.V_Name_E));
    const inPoly = CUR.filter(r => names.has(r.village)).length;
  }
  $("mapnote").textContent = note;
}

/* ================= VILLAGE POLYGONS (GeoJSON) ================= */
function setBoundary(gj) {
  gj.features.forEach(f => f.properties.V_Name_E = clean(f.properties.V_Name_E));   // remove stray spaces
  BGJ = gj;
  $("bndmsg").textContent = "Village polygons: " + gj.features.length + " loaded";
  if (map && CUR.length) drawMap(false);
}
function loadBoundary() {
  fetch(BOUNDARY_FILE, {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(setBoundary)
  .catch(() => {
    $("bndmsg").innerHTML = 'Could not read the polygon file automatically. Select it: <input type="file" id="bfile" accept=".geojson,.json">';
    $("bfile").onchange = e => { const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { setBoundary(JSON.parse(r.result)); } catch (x) { $("bndmsg").textContent = "Invalid GeoJSON file"; } };
      r.readAsText(f); };
  });
}

/* ================= UPDATE (redraw everything) ================= */
function update(fit) {
  renderFilters();
  if (!DATA.length) return;
  $("empty").hidden = true;
  $("srcinfo").textContent = `Source: ${DATA_FILE} | ${fmt(DATA.length)} producers`;
  const d = apply(FK.length); CUR = d;
  $("nomatch").hidden = d.length > 0; $("dash").hidden = !d.length;
  if (!d.length) return;

  const women = d.filter(r => r.sex === "Female").length;
  const landRows = d.filter(r => isFinite(r.land)), totalLand = landRows.reduce((s, r) => s + r.land, 0);
  const villagesN = new Set(d.map(r => r.village).filter(v => v !== OTHER)).size;
  const communesN = new Set(d.map(r => r.commune)).size;

  const act = FK.filter(k => F[k].size).map(k => `${LBL[k]}: ${F[k].size < 3 ? [...F[k]].join(", ") : F[k].size + " selected"}`);
  $("chips").innerHTML = (act.length ? act : ["All producers"]).map(a => `<span class="chip">${esc(a)}</span>`).join("");

  const kpi = (v, l, s) => `<div class="kpi"><div class="kv">${v}</div><div class="kl">${l}</div><div class="ks">${s}</div></div>`;
  $("kpis").innerHTML =
    kpi(fmt(d.length), "Producers", `${fmt(d.length / DATA.length * 100)}% of all records`) +
    kpi(fmt(women), "Women producers", `${fmt(women / d.length * 100)}% of producers`) +
    kpi(fmt(totalLand, 1), "Land under production (ha)", `from ${fmt(landRows.length)} producers with land recorded`) +
    kpi(fmt(villagesN), "Villages", `in ${fmt(communesN)} communes (excluding "${OTHER}")`);

  const cats = [...new Set(DATA.map(r => r.commodity))].sort();
  hbar($("commodity"), group(d, "commodity"), k => PAL[cats.indexOf(k) % 8]);

  const g = group(d, "sex");
  donut($("gender"), g, k => SEXCOL[k] || "#a3a3a3", fmt(women / d.length * 100) + "%", "women");

  hbar($("commune"), group(d, "commune").slice(0, 10));

  const bins = [["Under 0.5 ha", 0, 0.5], ["0.5 - 1 ha", 0.5, 1], ["1 - 2 ha", 1, 2], ["2 - 5 ha", 2, 5], ["5 ha and over", 5, 1e9]];
  const lb = bins.map(([k, a, b]) => ({k, v: landRows.filter(r => r.land >= a && r.land < b).length}));
  lb.push({k: "Not recorded", v: d.length - landRows.length});
  hbar($("land"), lb, (k, i) => i === lb.length - 1 ? "#a3a3a3" : "#0b6b3a");


  drawMap(fit);
}

/* ================= EVENTS + START ================= */
$("reset").onclick = resetAll;
["base", "showpoly", "showpts"].forEach(id => $(id).onchange = () => update(false));
$("zf").onclick = fitMap;
window.onresize = () => { if (map) map.invalidateSize(); };
update(false); load(); loadBoundary();
</script>
</body>
